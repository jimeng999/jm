services:
  - type: web
    name: ai-api-gateway
    runtime: python
    repo: https://github.com/jimeng999/jm
    branch: master
    rootDir: ai-api-gateway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
    plan: free
